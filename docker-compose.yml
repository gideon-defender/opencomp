x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'
    compress: 'true'

services:
  localstack:
    image: docker.io/localstack/localstack:3
    platform: linux/arm64
    environment:
      SERVICES: s3,sqs,ses
      DEBUG: '0'
      PERSISTENCE: '0'
    ports:
      - '4566:4566'
    volumes:
      - localstack_data:/var/lib/localstack
      - ./.localstack/init/ready.d:/etc/localstack/init/ready.d
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:4566/_localstack/health || exit 1']
      interval: 5s
      timeout: 5s
      retries: 24
    logging: *default-logging

  postgres:
    image: docker.io/pgvector/pgvector:pg16
    platform: linux/arm64
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: comp
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d comp']
      interval: 5s
      timeout: 5s
      retries: 12
    logging: *default-logging

  migrator:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/comp?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging

  seeder:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/comp?sslmode=disable
    command: ['./node_modules/.bin/tsx', 'packages/db/prisma/seed/seed.ts']
    depends_on:
      migrator:
        condition: service_completed_successfully
    logging: *default-logging

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.multistage
      target: production
    ports:
      - '3333:3333'
    env_file:
      - apps/api/.env
    environment:
      BASE_URL: http://localhost:3333
      # comp_app = least-privilege cache role (ACL-scoped to app:* keys).
      # comp_service = full-access queue role for BullMQ/trigger-local.
      REDIS_URL: redis://comp_app:comp_app_local_dev_password@redis:6379
      LOCAL_TRIGGER_REDIS_URL: redis://comp_service:comp_service_local_dev_password@redis:6379
      LOCAL_TRIGGER_QUEUE_SUFFIX: api
      # Self-hosted embeddings (BAAI/bge-m3 via Ollama) — replaces OpenAI.
      EMBEDDINGS_BASE_URL: http://embeddings:11434
      EMBEDDING_MODEL: bge-m3
      # Legacy Prisma client used by endpoints not yet migrated to RLS-aware clients.
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/comp?sslmode=disable
      # RLS client roles (created by the _add_rls_roles_and_tenant_policies migration).
      DATABASE_URL_TENANT: postgres://comp_app:comp_app_local_dev_password@postgres:5432/comp?sslmode=disable
      DATABASE_URL_SERVICE: postgres://comp_service:comp_service_local_dev_password@postgres:5432/comp?sslmode=disable
      # LocalStack S3/SQS/SES (see .env for host-agnostic localhost equivalents).
      APP_AWS_REGION: us-east-1
      APP_AWS_ACCESS_KEY_ID: test
      APP_AWS_SECRET_ACCESS_KEY: test
      APP_AWS_ENDPOINT: http://localstack:4566
      APP_AWS_BUCKET_NAME: comp-local-app
      APP_AWS_QUESTIONNAIRE_UPLOAD_BUCKET: comp-local-questionnaires
      APP_AWS_KNOWLEDGE_BASE_BUCKET: comp-local-knowledge-base
      APP_AWS_ORG_ASSETS_BUCKET: comp-local-org-assets
      EMAIL_SQS_QUEUE_URL: http://localstack:4566/000000000000/comp-emails
      PORTAL_URL: http://portal:3000
      # Browser-facing base for emailed trust links — must resolve on the
      # recipient's machine, never an in-network hostname like trust-center.
      TRUST_APP_URL: http://localhost:3008
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
      localstack:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget --no-verbose --tries=1 --spider http://localhost:3333/v1/health || exit 1',
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging: *default-logging

  redis:
    image: docker.io/library/redis:7-alpine
    platform: linux/arm64
    ports:
      - '6379:6379'
    command: ['redis-server', '/usr/local/etc/redis/redis.conf']
    volumes:
      - ./infra/redis/redis.conf:/usr/local/etc/redis/redis.conf
      - redis_data:/data
    healthcheck:
      # requirepass locks the DEFAULT user, so the probe must authenticate.
      test:
        [
          'CMD-SHELL',
          'redis-cli --no-auth-warning -a comp_master_local_dev_password ping | grep PONG',
        ]
      interval: 5s
      timeout: 5s
      retries: 12
    logging: *default-logging

  email-worker:
    # Polls the comp-emails SQS queue and sends via SES.
    build:
      context: .
      dockerfile: apps/api/Dockerfile.multistage
      target: production
    command: ['node', 'dist/src/email-worker/main.js']
    env_file:
      - apps/api/.env
    environment:
      APP_AWS_REGION: us-east-1
      APP_AWS_ACCESS_KEY_ID: test
      APP_AWS_SECRET_ACCESS_KEY: test
      APP_AWS_ENDPOINT: http://localstack:4566
      EMAIL_SQS_QUEUE_URL: http://localstack:4566/000000000000/comp-emails
    depends_on:
      localstack:
        condition: service_healthy
    restart: unless-stopped
    # The baked-in API healthcheck (HTTP on :3333) doesn't apply to this process.
    healthcheck:
      disable: true
    logging: *default-logging

  embeddings:
    # Self-hosted embedding server (BAAI/bge-m3, 1024 dims). Ollama publishes
    # linux/arm64 images (TEI is amd64-only), so it runs natively on this Mac.
    # The entrypoint pulls bge-m3 on first boot (idempotent once cached).
    image: docker.io/ollama/ollama
    platform: linux/arm64
    ports:
      - '11434:11434'
    entrypoint:
      - /bin/sh
      - -c
      - 'ollama serve & until ollama list >/dev/null 2>&1; do sleep 1; done; ollama pull bge-m3; wait'
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ['CMD', 'ollama', 'list']
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    logging: *default-logging

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
      args:
        NEXT_PUBLIC_BETTER_AUTH_URL: http://localhost:3000
        NEXT_PUBLIC_PORTAL_URL: http://localhost:3002
        NEXT_PUBLIC_API_URL: http://localhost:3333
        NEXT_PUBLIC_POSTHOG_HOST: /ingest
        NEXT_PUBLIC_POSTHOG_KEY: ''
        NEXT_PUBLIC_IS_DUB_ENABLED: 'false'
    ports:
      - '3000:3000'
    env_file:
      - apps/app/.env
    environment:
      HOSTNAME: 0.0.0.0
      BACKEND_API_URL: http://api:3333
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/comp?sslmode=disable
      REDIS_URL: redis://comp_app:comp_app_local_dev_password@redis:6379
      LOCAL_TRIGGER_REDIS_URL: redis://comp_service:comp_service_local_dev_password@redis:6379
      LOCAL_TRIGGER_QUEUE_SUFFIX: app
      # Self-hosted embeddings (BAAI/bge-m3 via Ollama) — replaces OpenAI.
      EMBEDDINGS_BASE_URL: http://embeddings:11434
      EMBEDDING_MODEL: bge-m3
      # LocalStack S3 (app/s3.ts fails closed to a dummy client without these).
      APP_AWS_REGION: us-east-1
      APP_AWS_ACCESS_KEY_ID: test
      APP_AWS_SECRET_ACCESS_KEY: test
      APP_AWS_ENDPOINT: http://localstack:4566
      APP_AWS_BUCKET_NAME: comp-local-app
      APP_AWS_QUESTIONNAIRE_UPLOAD_BUCKET: comp-local-questionnaires
      APP_AWS_KNOWLEDGE_BASE_BUCKET: comp-local-knowledge-base
      APP_AWS_ORG_ASSETS_BUCKET: comp-local-org-assets
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(\"http://localhost:3000/api/health\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging: *default-logging

  portal:
    build:
      context: .
      dockerfile: Dockerfile
      target: portal
      args:
        NEXT_PUBLIC_BETTER_AUTH_URL: http://localhost:3002
    ports:
      - '3002:3000'
    env_file:
      - apps/portal/.env
    environment:
      HOSTNAME: 0.0.0.0
      BACKEND_API_URL: http://api:3333
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/comp?sslmode=disable
      REDIS_URL: redis://comp_app:comp_app_local_dev_password@redis:6379
    depends_on:
      - api
      - redis
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(\"http://localhost:3000/\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging: *default-logging

  trust-center:
    build:
      context: .
      dockerfile: Dockerfile
      target: trust-center
      args:
        NEXT_PUBLIC_TRUST_API_URL: ${NEXT_PUBLIC_TRUST_API_URL:-http://localhost:3333}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3333}
    ports:
      - '3008:3000'
    environment:
      HOSTNAME: 0.0.0.0
      BACKEND_API_URL: http://api:3333
      # NOTE: trust-center reads NEXT_PUBLIC_TRUST_API_URL at build time
      # (inlined into the browser bundle) — set it as a build arg above,
      # not here. A runtime value cannot change the shipped bundle.
    depends_on:
      - api
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(\"http://localhost:3000/\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging: *default-logging

volumes:
  postgres_data:
  localstack_data:
  redis_data:
  ollama_data:
