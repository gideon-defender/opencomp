version: 0.2

phases:
  pre_build:
    commands:
      - echo "Installing dependencies for migrations..."
      - corepack enable && corepack prepare pnpm@10.15.0 --activate

  build:
    commands:
      # Environment setup
      - export PGSSLMODE=require
      - export NODE_TLS_REJECT_UNAUTHORIZED=0

      # Install dependencies
      - echo "Installing dependencies..."
      - cd packages/db
      - SKIP_ENV_VALIDATION=true pnpm install --frozen-lockfile || SKIP_ENV_VALIDATION=true pnpm install

      # Generate Prisma client
      - echo "Generating Prisma client..."
      - pnpm exec prisma generate

      # Run database migrations
      - echo "Running database migrations..."
      - 'echo "DATABASE_URL is configured: $([ -n \"$DATABASE_URL\" ] && echo ''YES'' || echo ''NO'')"'
      - pnpm exec prisma migrate deploy

      # Verify migration success
      - echo "Verifying database schema..."
      - pnpm exec prisma db pull --print

  post_build:
    commands:
      - echo "Database migrations completed successfully on `date`"

cache:
  paths:
    - 'node_modules/**/*'
    - 'packages/db/node_modules/**/*'
