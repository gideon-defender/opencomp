name: Publish MCP
on:
  push:
    branches: [release]
  workflow_dispatch:
    inputs:
      version:
        description: Explicit package version (must match apps/mcp-server/package.json)
        required: true
        type: string
      tested_prerelease:
        description: Matching X.Y.Z-next.N required for stable publication
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: mcp-publish
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/mcp-check.yml
  acceptance:
    runs-on: ubuntu-latest
    outputs:
      accepted: ${{ steps.policy.outputs.accepted }}
      prerelease: ${{ steps.policy.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5
      - id: policy
        name: Read Phase 5 acceptance gate
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const policy = JSON.parse(fs.readFileSync('apps/mcp-server/release-policy.json')); fs.appendFileSync(process.env.GITHUB_OUTPUT, 'accepted=' + (policy.cutoverAccepted === true) + '\\nprerelease=' + (policy.prereleaseApproved === true) + '\\n');"
  publish:
    needs: [checks, acceptance]
    # Pushes run validation, never infer a version or publish automatically.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/release' && ((contains(inputs.version, '-next.') && needs.acceptance.outputs.prerelease == 'true') || (!contains(inputs.version, '-') && needs.acceptance.outputs.accepted == 'true'))
    runs-on: ubuntu-latest
    environment: mcp-npm-publish
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/pnpm-install
      - uses: actions/setup-node@v5
        with:
          node-version: v22.x
          registry-url: https://registry.npmjs.org
      - name: Build and recheck before publishing
        run: |
          pnpm --filter @gideon-defender/mcp-server run build
          pnpm --filter @gideon-defender/mcp-server run test
      - name: Verify explicit version, registry and tested prerelease; prepare package
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          TESTED_PRERELEASE: ${{ inputs.tested_prerelease }}
        run: |
          node apps/mcp-server/scripts/release-prepare.mjs --version "$RELEASE_VERSION" --prerelease "$TESTED_PRERELEASE" --out-dir "$RUNNER_TEMP/mcp-release"
      - name: Publish staged package (already-published matching versions are skipped)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [ ! -d "$RUNNER_TEMP/mcp-release" ]; then exit 0; fi
          tag=latest
          if [[ "$RELEASE_VERSION" == *-next.* ]]; then tag=next; fi
          pnpm --dir "$RUNNER_TEMP/mcp-release" publish --access public --tag "$tag" --no-git-checks
