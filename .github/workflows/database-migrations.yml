name: Database Migrations
on:
  pull_request: # Validates migrations on PRs to main — ephemeral DB only, no real data at risk
    branches:
      - main
  push: # Runs AFTER merge to main
    branches:
      - main
  workflow_dispatch: # Allows manual triggering

concurrency:
  group: db-migrations-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read # only needs to check out the repo to validate migrations

jobs:
  validate:
    name: Validate Database Migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: comp
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d comp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Ephemeral database: validates migrations apply cleanly from scratch
      # without touching any real environment. Real migrations run via the
      # ECS migrator task during deploy (see deploy-dev.yml).
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/comp?sslmode=disable
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - uses: ./.github/actions/pnpm-install

      - name: Validate migrations apply cleanly
        working-directory: packages/db
        run: pnpm exec prisma migrate deploy
