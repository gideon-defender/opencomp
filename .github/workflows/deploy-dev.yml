name: Deploy to Dev

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-dev
  cancel-in-progress: false

env:
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
  IMAGE_TAG: dev-${{ github.event.workflow_run.head_sha || github.sha }}-${{ github.run_id }}

jobs:
  authorize:
    name: Authorize main deployment
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: Require the current main commit
        uses: actions/github-script@v9
        with:
          script: |
            const { data } = await github.rest.git.getRef({
              owner: context.repo.owner, repo: context.repo.repo, ref: 'heads/main',
            });
            if (data.object.sha !== process.env.DEPLOY_SHA) {
              core.setFailed('Only the current main commit may deploy.');
            }
      - name: Require repository administrator
        if: github.event_name == 'workflow_dispatch'
        uses: actions/github-script@v9
        with:
          script: |
            // Use triggering_actor so a non-admin cannot rerun an admin's workflow.
            const actor = process.env.GITHUB_TRIGGERING_ACTOR || context.actor;
            const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: actor,
            });

            if (data.permission !== 'admin') {
              core.setFailed(
                `Only repository administrators may run this workflow (actor: ${actor}, permission: ${data.permission}).`,
              );
            }

  preflight:
    name: Check MCP infrastructure is provisioned
    needs: authorize
    runs-on: ubuntu-latest
    environment:
      name: dev
    steps:
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ secrets.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-session-name: github-mcp-preflight-${{ github.run_id }}
      - name: Require the owned MCP service before building or migrating
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          ECS_CLUSTER: ${{ secrets.ECS_CLUSTER }}
        shell: bash
        run: |
          set -euo pipefail
          status="$(aws ecs describe-services --region "$AWS_REGION" --cluster "$ECS_CLUSTER" --services gideon-dev-opencomp-mcp --query 'services[0].status' --output text)"
          if [ "$status" != ACTIVE ]; then
            echo 'Provision terraform/opencomp MCP infrastructure in everything-as-code before deploying this branch.'
            exit 1
          fi

  build:
    name: Build and push images
    needs: [authorize, preflight]
    if: needs.authorize.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: dev
    strategy:
      # One failing image should not cancel the others mid-build; the
      # deploy job below only runs when every image built successfully.
      fail-fast: false
      matrix:
        include:
          - image: gideon-dev-opencomp-api
            file: apps/api/Dockerfile.multistage
            target: production
            args: ''
          - image: gideon-dev-opencomp-app
            file: Dockerfile
            target: app
            args: |
              NEXT_PUBLIC_API_URL=https://opencomp-api.dev.gideondefender.com
              NEXT_PUBLIC_BETTER_AUTH_URL=https://opencomp-api.dev.gideondefender.com
              NEXT_PUBLIC_PORTAL_URL=https://portal.dev.gideondefender.com
              NEXT_PUBLIC_IS_DUB_ENABLED=false
          - image: gideon-dev-opencomp-trust-center
            file: Dockerfile
            target: trust-center
            args: |
              NEXT_PUBLIC_TRUST_API_URL=https://opencomp-api.dev.gideondefender.com
              NEXT_PUBLIC_API_URL=https://opencomp-api.dev.gideondefender.com
          - image: gideon-dev-opencomp-mcp
            file: apps/mcp-server/Dockerfile
            target: production
            args: ''
          - image: gideon-dev-opencomp-migrator
            file: Dockerfile
            target: migrator
            args: ''
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: ${{ env.DEPLOY_SHA }}
          fetch-depth: 1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-session-name: github-deploy-dev-${{ github.run_id }}-${{ matrix.image }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push ${{ matrix.image }} image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/arm64
          push: ${{ matrix.image != 'gideon-dev-opencomp-mcp' }}
          load: ${{ matrix.image == 'gideon-dev-opencomp-mcp' }}
          tags: ${{ env.ECR_REGISTRY }}/${{ matrix.image }}:${{ env.IMAGE_TAG }}
          build-args: ${{ matrix.args }}
          # Per-image cache scope so parallel jobs don't clobber each other's layers.
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Smoke test hosted MCP image before pushing
        if: matrix.image == 'gideon-dev-opencomp-mcp'
        shell: bash
        run: |
          set -euo pipefail
          image="$ECR_REGISTRY/${{ matrix.image }}:$IMAGE_TAG"
          container="$(docker run -d --read-only --cap-drop ALL --security-opt no-new-privileges "$image" serve --hosted --mode dynamic --server-url https://opencomp-api.dev.gideondefender.com --public-url https://mcp.dev.gideondefender.com)"
          trap 'docker rm -f "$container" >/dev/null' EXIT
          for attempt in $(seq 1 30); do
            state="$(docker inspect --format '{{.State.Health.Status}}' "$container")"
            if [ "$state" = healthy ]; then break; fi
            sleep 2
          done
          test "$state" = healthy
          docker exec "$container" node -e "require('http').request('http://127.0.0.1:2718/mcp',{method:'POST',headers:{host:'mcp.dev.gideondefender.com'}},r=>{r.resume();process.exit(r.statusCode===401?0:1)}).on('error',()=>process.exit(1)).end()"
          docker push "$image"

  deploy:
    name: Build and deploy main to dev
    needs: [authorize, build]
    if: needs.authorize.result == 'success' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: dev
    env:
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      ECS_CLUSTER: ${{ secrets.ECS_CLUSTER }}
      ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
      MIGRATOR_SUBNETS: ${{ secrets.MIGRATOR_SUBNETS }}
      MIGRATOR_SECURITY_GROUP: ${{ secrets.MIGRATOR_SECURITY_GROUP }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: ${{ env.DEPLOY_SHA }}
          fetch-depth: 1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-session-name: github-deploy-dev-${{ github.run_id }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Reject a superseded main commit
        uses: actions/github-script@v9
        with:
          script: |
            const { data } = await github.rest.git.getRef({
              owner: context.repo.owner, repo: context.repo.repo, ref: 'heads/main',
            });
            if (data.object.sha !== process.env.DEPLOY_SHA) {
              core.setFailed('Main advanced during this build; deploy the newer successful CI commit.');
            }

      - name: Register task definitions and update ECS services
        shell: bash
        run: |
          bash .github/scripts/deploy-dev.sh

      - name: Wait for ECS services
        shell: bash
        run: |
          set -euo pipefail
          for service in \
            gideon-dev-opencomp-mcp \
            gideon-dev-opencomp-api \
            gideon-dev-opencomp-app \
            gideon-dev-opencomp-trust-center \
            gideon-dev-opencomp-email-worker; do
            aws ecs wait services-stable \
              --region "$AWS_REGION" \
              --cluster "$ECS_CLUSTER" \
              --services "$service"
          done
          while IFS='|' read -r service expected; do
            actual="$(aws ecs describe-services --region "$AWS_REGION" --cluster "$ECS_CLUSTER" --services "$service" --query 'services[0].taskDefinition' --output text)"
            if [ "$actual" != "$expected" ]; then
              echo "$service rolled back or did not deploy the requested task definition"
              exit 1
            fi
          done < "$RUNNER_TEMP/opencomp-expected-tasks"

      - name: Verify hosted MCP edge
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-delay 5 https://mcp.dev.gideondefender.com/healthz
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --request POST https://mcp.dev.gideondefender.com/mcp)"
          test "$status" = 401

      - name: Print deployment summary
        run: |
          aws ecs describe-services \
            --region "$AWS_REGION" \
            --cluster "$ECS_CLUSTER" \
            --services \
              gideon-dev-opencomp-mcp \
              gideon-dev-opencomp-api \
              gideon-dev-opencomp-app \
              gideon-dev-opencomp-trust-center \
              gideon-dev-opencomp-email-worker \
            --query 'services[].{service:serviceName,taskDefinition:taskDefinition,desired:desiredCount,running:runningCount}' \
            --output table
